<!-- GlobalSearchComponent.html -->
<div class="search-container">
  <input
    type="text"
    [(ngModel)]="searchQuery"
    (input)="onSearch()"
    (keydown)="onKeydown($event)"
    placeholder="Search..."
    aria-label="Search"
  />
  <div class="search-controls">
    @if(searchQuery){
    <!------- Clear Icon ------>
    <button class="clear-button" (click)="clearSearch()" title="Clear search">
      ✕
    </button>
    <!------- Up Icon ------>
    <button
      class="prev-button"
      (click)="searchService.navigateHighlight(false)"
      title="Previous match"
    >
      ↑
    </button>
    <!------- Down Icon ------>
    <button
      class="next-button"
      (click)="searchService.navigateHighlight(true)"
      title="Next match"
    >
      ↓
    </button>

    }
  </div>
</div>

<!-- Content Area -->
<div #content class="content">
  <app-child-list></app-child-list>
  <app-child-paragraph></app-child-paragraph>
  <app-child-table></app-child-table>
</div>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 speech-card p-4 shadow-lg rounded">
      <h2 class="text-center mb-4">🎤 Speech-to-Text Converter</h2>

      <div class="mb-3">
        <label for="languageSelect" class="form-label fw-bold">Select
          Language</label>
        <select
          id="languageSelect"
          class="form-select"
          [(ngModel)]="selectedLanguage">
          @for(lang of languages; track lang){
          <option [value]="lang.code">
            {{ lang.name }}
          </option>
          }
        </select>
      </div>

      <div class="form-group mb-3 position-relative">
        <label for="transcriptArea" class="form-label fw-bold">Transcribed
          Text</label>
        <textarea
          id="transcriptArea"
          class="form-control"
          rows="15"
          placeholder="Click the microphone and start speaking..."
          [(ngModel)]="transcript"
          [readonly]="isListening"></textarea>

        <div class="input-controls">
          <button
            type="button"
            class="btn btn-sm clear-btn"
            (click)="clearTranscript()"
            [disabled]="!transcript && !isListening"
            title="Clear Text and Stop Listening">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
              fill="currentColor" stroke="currentColor" stroke-width="1.5"
              class="bi bi-x-lg" viewBox="0 0 16 16">
              <path
                d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z" />
            </svg>
          </button>

          <button
            type="button"
            class="btn mic-btn"
            (click)="toggleListening()"
            [class.listening-active]="isListening"
            title="Start/Stop Voice Input">

            <!-- shown when NOT listening -->
            @if(!isListening){
            <svg class="mic-icon" xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16" role="img" aria-label="Start listening">
              <path d="M5 3a3 3 0 0 1 6 0v5a3 3 0 0 1-6 0z" />
              <path
                d="M3.5 6.5A.5.5 0 0 1 4 7v1a4 4 0 0 0 8 0V7a.5.5 0 0 1 1 0v1a5 5 0 0 1-4.5 4.975V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 .5-.5" />
            </svg>
            }

            <!-- shown when listening -->
            @if(isListening){
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
              class="mic-icon" role="img" aria-label="Stop listening">
              <path
                d="M13 8c0 .564-.094 1.107-.266 1.613l-.814-.814A4 4 0 0 0 12 8V7a.5.5 0 0 1 1 0zm-5 4c.818 0 1.578-.245 2.212-.667l.718.719a5 5 0 0 1-2.43.923V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 1 0v1a4 4 0 0 0 4 4m3-9v4.879L5.158 2.037A3.001 3.001 0 0 1 11 3" />
              <path
                d="M9.486 10.607 5 6.12V8a3 3 0 0 0 4.486 2.607m-7.84-9.253 12 12 .708-.708-12-12z" />
            </svg>
            }
          </button>

        </div>
      </div>

      @if(errorMessage){
      <div class="alert alert-danger d-flex align-items-center" role="alert">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16" height="16"
          fill="currentColor"
          class="exclamation-icon me-2"
          viewBox="0 0 16 16">
          <path
            d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2" />
        </svg>
        <div>
          {{ errorMessage }}
        </div>
      </div>
      }

      <p
        class="status-message text-center p-2 rounded"
        [class.status-listening]="isListening"
        [class.status-stopped]="!isListening && !errorMessage">
        {{
        isListening
        ? "🔴 LISTENING... Speak Now"
        : "Click the microphone to start speaking"
        }}
      </p>
    </div>
  </div>
</div>

<div class="container mt-4">
  <div class="row">
    <!-- Left Side: Upload Section -->
    <div class="col-4">
      <div
        class="upload-zone p-4 text-center border rounded mb-3"
        [class.dragging]="isDragging"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
      >
        <div class="mb-3">
          <i class="bi bi-cloud-upload fs-1 text-primary"></i>
        </div>
        <h5>Drag & Drop SVG files here</h5>
        <p class="text-muted">or</p>
        <input
          type="file"
          #fileInput
          multiple
          accept=".svg"
          (change)="onFileSelected($event)"
          style="display: none"
        />
        <button class="btn btn-outline-primary" (click)="fileInput.click()">
          Browse Files
        </button>
      </div>

      <div class="d-grid gap-2">
        <button
          class="btn btn-danger"
          (click)="deleteAll()"
          [disabled]="convertedFiles.length === 0"
        >
          Clear All
        </button>
        <button
          class="btn btn-success"
          (click)="downloadAll()"
          [disabled]="convertedFiles.length === 0"
        >
          Download All
        </button>
      </div>
    </div>

    <!-- Right Side: Preview Section -->
    <div class="col-8">
      <h4 class="mb-3">Converted Files</h4>
      
      <div class="list-group">
        <div
          *ngFor="let item of convertedFiles; let i = index"
          class="list-group-item d-flex align-items-center justify-content-between"
        >
          <div class="d-flex align-items-center flex-grow-1 overflow-hidden">
            <!-- Preview Image -->
            <div class="preview-box me-3">
              <div
                *ngIf="item.loading"
                class="spinner-border text-primary spinner-sm"
                role="status"
              >
                <span class="visually-hidden">Loading...</span>
              </div>
              <img
                *ngIf="!item.loading"
                [src]="item.url"
                alt="Preview"
                class="preview-img"
              />
            </div>
            
            <!-- File Name -->
             <div class="file-name text-truncate" [title]="item.name">
              {{ item.name }}
            </div>
          </div>

          <!-- Actions -->
          <div class="d-flex gap-2">
            <button
               class="btn btn-sm btn-outline-danger"
               (click)="deleteFile(i)"
               title="Delete"
            >
              <i class="bi bi-trash"></i> Delete
            </button>
            <button
              class="btn btn-sm btn-outline-success"
              (click)="downloadFile(item)"
              [disabled]="item.loading"
              title="Download"
            >
              <i class="bi bi-download"></i> Download
            </button>
          </div>
        </div>
        
        <div *ngIf="convertedFiles.length === 0" class="text-center text-muted py-5 border rounded bg-light">
           No files converted yet.
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <div class="audio-wrapper">
    <div class="controls">
      <!-- Loader -->
      @if (isLoading) {
      <button class="play-button" aria-label="Loading...">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="24"
          height="24">
          <path
            d="M12 4V2C6.48 2 2 6.48 2 12h2c0-4.41 3.59-8 8-8z"
            fill="currentColor">
            <animateTransform
              attributeName="transform"
              attributeType="XML"
              type="rotate"
              from="0 12 12"
              to="360 12 12"
              dur="1s"
              repeatCount="indefinite" />
          </path>
        </svg>
      </button>
      }

      <!-- Error message -->
      @if (loadError) {
      <div class="error-message">Failed to load audio. Please try again.</div>
      }

      <!-- PLAY -->
      @if (!isPlaying && !isLoading && !loadError) {
      <button class="play-button" (click)="playAudio()" aria-label="Play">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="24"
          height="24">
          <path d="M8 5v14l11-7z" fill="currentColor" />
        </svg>
      </button>
      }

      <!-- STOP -->
      @if (isPlaying && !isLoading) {
      <button class="play-button" (click)="stopAudio()" aria-label="Stop">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="24"
          height="24">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="currentColor" />
        </svg>
      </button>
      }
    </div>

    <canvas
      #canvas
      width="1000"
      [height]="trackHeight"
      (click)="onCanvasClick($event)">
    </canvas>

    <audio #audio [src]="audioUrl" preload="auto"></audio>
  </div>
</div>

<div class="wysiwyg-container">
  <div class="toolbar">
    <!-- Headings -->
    <select
      [(ngModel)]="currentHeading"
      (change)="formatBlock($event)"
      title="Headings"
      [disabled]="isPreviewMode">
      @for (h of headings; track h.value) {
      <option [value]="h.value">{{h.label}}</option>
      }
    </select>

    <!-- Font Size -->
    <select
      [(ngModel)]="currentFontSize"
      (change)="setFontSize($event)"
      title="Font Size"
      [disabled]="isPreviewMode">
      @for (size of fontSizes; track size) {
      <option [value]="size">{{size}}</option>
      }
    </select>

    <!-- Basic Formatting -->
    <button
      type="button"
      class="toolbar-btn"
      (click)="execCommand('bold')"
      [class.active]="toolbarState['bold']"
      [disabled]="isPreviewMode"
      title="Bold">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path
          d="M15.6 10.79c.97-.67 1.65-1.77 1.65-2.79 0-2.26-1.75-4-4-4H7v14h7.04c2.09 0 3.71-1.7 3.71-3.79 0-1.52-.86-2.82-2.15-3.42zM10 6.5h3c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-3v-3zm3.5 9H10v-3h3.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5z" />
      </svg>
    </button>
    <button
      type="button"
      class="toolbar-btn"
      (click)="execCommand('italic')"
      [class.active]="toolbarState['italic']"
      [disabled]="isPreviewMode"
      title="Italic">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path d="M10 4v3h2.21l-3.42 8H6v3h8v-3h-2.21l3.42-8H18V4z" />
      </svg>
    </button>
    <button
      type="button"
      class="toolbar-btn"
      (click)="execCommand('underline')"
      [class.active]="toolbarState['underline']"
      [disabled]="isPreviewMode"
      title="Underline">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path
          d="M12 17c3.31 0 6-2.69 6-6V3h-2.5v8c0 1.93-1.57 3.5-3.5 3.5S8.5 12.93 8.5 11V3H6v8c0 3.31 2.69 6 6 6zm-7 2v2h14v-2H5z" />
      </svg>
    </button>

    <!-- Text-Color and Background-Color -->
    <!-- Text-Color -->
    <div class="color-picker-wrapper" title="Text Color" 
         [class.disabled]="isPreviewMode"
         (mousedown)="!isPreviewMode && saveSelection()">
      <input
        type="color"
        [value]="currentForeColor"
        (change)="onColorPickerChange('fore', $event)"
        [disabled]="isPreviewMode" />
      <input 
        type="text" 
        [value]="currentForeColor"
        (keyup.enter)="onHexInputChange('fore', $event)"
        (blur)="onHexInputChange('fore', $event)"
        [disabled]="isPreviewMode"
        maxlength="7"
        placeholder="#000000">
    </div>

    <!-- Background-Color -->
    <div class="color-picker-wrapper" title="Background Color" 
         [class.disabled]="isPreviewMode"
         (mousedown)="!isPreviewMode && saveSelection()">
      <input
        type="color"
        [value]="currentBackColor"
        (change)="onColorPickerChange('back', $event)"
        [disabled]="isPreviewMode" />
      <input 
        type="text" 
        [value]="currentBackColor"
        (keyup.enter)="onHexInputChange('back', $event)"
        (blur)="onHexInputChange('back', $event)"
        [disabled]="isPreviewMode"
        maxlength="7"
        placeholder="#FFFFFF">
    </div>

    <!-- Left, Center, Right Alignment -->
    <button
      class="toolbar-btn"
      (click)="execCommand('justifyLeft')"
      [class.active]="toolbarState['justifyLeft']"
      [disabled]="isPreviewMode"
      title="Align Left">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path
          d="M15 15H3v2h12v-2zm0-8H3v2h12V7zM3 13h18v-2H3v2zm0 8h18v-2H3v2zM3 3v2h18V3H3z" />
      </svg>
    </button>
    <button
      type="button"
      class="toolbar-btn"
      (click)="execCommand('justifyCenter')"
      [class.active]="toolbarState['justifyCenter']"
      [disabled]="isPreviewMode"
      title="Align Center">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path
          d="M7 15v2h10v-2H7zm-4 6h18v-2H3v2zm0-8h18v-2H3v2zm4-6v2h10V7H7zM3 3v2h18V3H3z" />
      </svg>
    </button>
    <button
      type="button"
      class="toolbar-btn"
      (click)="execCommand('justifyRight')"
      [class.active]="toolbarState['justifyRight']"
      [disabled]="isPreviewMode"
      title="Align Right">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path
          d="M3 21h18v-2H3v2zm6-4h12v-2H9v2zm-6-4h18v-2H3v2zm6-4h12V7H9v2zM3 3v2h18V3H3z" />
      </svg>
    </button>

    <!-- Indent/Outdent Text -->
    <button
      type="button"
      class="toolbar-btn"
      (click)="execCommand('indent')"
      title="Indent"
      [disabled]="isPreviewMode">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path
          d="M3 21h18v-2H3v2zM3 8v8l4-4-4-4zm8 9h10v-2H11v2zM3 3v2h18V3H3zm8 6h10V7H11v2zm0 4h10v-2H11v2z" />
      </svg>
    </button>
    <button
      type="button"
      class="toolbar-btn"
      (click)="execCommand('outdent')"
      title="Outdent"
      [disabled]="isPreviewMode">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path
          d="M11 17h10v-2H11v2zm-8-5l4 4V8l-4 4zm0 9h18v-2H3v2zM3 3v2h18V3H3zm8 6h10V7H11v2zm0 4h10v-2H11v2z" />
      </svg>
    </button>

    <!-- Sub/Super Script Text -->
    <button
      type="button"
      class="toolbar-btn"
      (click)="execCommand('subscript')"
      [class.active]="toolbarState['subscript']"
      [disabled]="isPreviewMode"
      title="Subscript">
      <span style="font-size: 10px">X<sub>2</sub></span>
    </button>
    <button
      type="button"
      class="toolbar-btn"
      (click)="execCommand('superscript')"
      [class.active]="toolbarState['superscript']"
      [disabled]="isPreviewMode"
      title="Superscript">
      <span style="font-size: 10px">X<sup>2</sup></span>
    </button>

    <!-- Ordered/Unordered Lists -->
    <button
      type="button"
      class="toolbar-btn"
      (click)="execCommand('insertOrderedList')"
      [class.active]="toolbarState['insertOrderedList']"
      [disabled]="isPreviewMode"
      title="Ordered List">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path
          d="M2 17h2v.5H3v1h1v.5H2v1h3v-4H2v1zm1-9h1V4H2v1h1v3zm-1 3h1.8L2 13.1v.9h3v-1H3.2L5 10.9V10H2v1zm5-6v2h14V5H7zm0 14h14v-2H7v2zm0-6h14v-2H7v2z" />
      </svg>
    </button>
    <button
      type="button"
      class="toolbar-btn"
      (click)="execCommand('insertUnorderedList')"
      [class.active]="toolbarState['insertUnorderedList']"
      [disabled]="isPreviewMode"
      title="Unordered List">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path
          d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12.17c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z" />
      </svg>
    </button>

    <!-- Link & Image -->
    <button
      type="button"
      class="toolbar-btn"
      (click)="toggleLinkInput()"
      [class.active]="showLinkInput"
      [disabled]="isPreviewMode"
      title="Link">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path
          d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z" />
      </svg>
    </button>

    @if (showLinkInput) {
    <div class="link-input-group">
      <input
        type="text"
        [(ngModel)]="linkUrl"
        placeholder="https://..."
        (keyup.enter)="applyLink()" />
      <button type="button" class="toolbar-btn" (click)="applyLink()">✓</button>
    </div>
    }

    <label
      class="image-upload"
      title="Upload Image"
      [class.disabled]="isPreviewMode"
      (mousedown)="!isPreviewMode && saveSelection()">
      <input
        type="file"
        (change)="insertImage($event)"
        accept="image/*"
        hidden
        [disabled]="isPreviewMode" />
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path
          d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z" />
      </svg>
    </label>

    <!-- Horizontal Line -->
    <button
      type="button"
      class="toolbar-btn"
      (click)="execCommand('insertHorizontalRule')"
      title="Horizontal Line"
      [disabled]="isPreviewMode">
      <span style="font-weight: bold">&mdash;</span>
    </button>

    <button
      type="button"
      class="toolbar-btn"
      (click)="insertCodeBlock()"
      title="Insert Code Block"
      [disabled]="isPreviewMode">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path
          d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z" />
      </svg>
    </button>

    <select
      [(ngModel)]="selectedLanguage"
      (change)="updateCodeBlockLanguage()"
      title="Select Language"
      [disabled]="isPreviewMode">
      @for (lang of languages; track lang.value) {
      <option [value]="lang.value">{{lang.label}}</option>
      }
    </select>

    <!-- Code Block -->
    <div class="code-block-controls"></div>

    <!-- Toggle Preview Button -->
    <button
      type="button"
      class="toolbar-btn"
      (click)="togglePreview()"
      [class.active]="isPreviewMode"
      title="Toggle HTML Source">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path
          d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
      </svg>
    </button>
    <button
      type="button"
      class="toolbar-btn"
      (click)="exportPdf()"
      [class.disabled]="isPreviewMode"
      [disabled]="isPreviewMode"
      title="Export PDF">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path
          d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v2.5zm2.5 9.5c0 .83-.67 1.5-1.5 1.5H9v-1h3.5v-1H10v-3h2.5v4zm2.5-3.5h-2.5v-4h2.5c.83 0 1.5.67 1.5 1.5v1c0 .83-.67 1.5-1.5 1.5zM9 9.5h1v-1H9v1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm10 5.5h1v-3h-1v3z" />
      </svg>
    </button>
  </div>

  <div class="editor-wrapper">
    <!-- Editor -->
    <div
      #editor
      class="editor"
      contenteditable="true"
      (input)="onInput()"
      (paste)="onPaste($event)"
      (keydown)="onKeyDown($event)"
      (keyup)="updateToolbarState()"
      (mouseup)="updateToolbarState()"
      [hidden]="isPreviewMode"></div>

    <!-- Preview -->
    @if (isPreviewMode) {
    <div class="preview">
      <pre><code [innerText]="htmlSource"></code></pre>
    </div>
    }
  </div>
</div>

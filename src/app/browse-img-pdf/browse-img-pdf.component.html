<!------------------------------------------------------------------>

<div class="container mt-4">
  <div class="row">
    <div class="col-12">
      <div class="mb-3">
        <label for="imageUpload" class="form-label">Choose Images</label>
        <input
          type="file"
          class="form-control"
          id="imageUpload"
          multiple
          accept="image/*"
          (change)="onFileSelected($event)"
        />
      </div>
    </div>
  </div>

  @if(previewUrls.length > 0){
  <div class="row">
    <div class="col-12 mb-3">
      <h4>Selected Images</h4>
    </div>
    @for(url of previewUrls; track url; let i = $index){
    <div class="col-md-3 mb-3">
      <div class="card">
        <img [src]="url" class="card-img-top" [alt]="'Image ' + (i + 1)" />
        <div class="card-body">
          <button class="btn btn-danger btn-sm" (click)="removeImage(i)">
            Remove
          </button>
        </div>
      </div>
    </div>
    }
  </div>
  } @if(previewUrls.length > 0){
  <div class="row mt-3">
    <div class="col-12">
      <button
        class="btn btn-primary"
        [disabled]="isGenerating"
        (click)="convertToPdf()"
      >
        {{ isGenerating ? "Generating PDF..." : "Convert to PDF" }}
      </button>
    </div>
  </div>
  } @if(errorMessage){
  <div class="row mt-3">
    <div class="col-12">
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        {{ errorMessage }}
        <button
          type="button"
          class="btn-close"
          (click)="errorMessage = ''"
        ></button>
      </div>
    </div>
  </div>
  }
</div>
